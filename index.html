<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi plan · Alexandra</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f4;--card:#fff;--ink:#3a2431;--mut:#7d6571;--acc:#c2456b;--acc2:#fbd9e2;--line:#f0d7de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231820;--card:#322230;--ink:#fbeef2;--mut:#c9adb8;--acc:#ff8fb0;--acc2:#4a2a3b;--line:#4a3443}}
:root[data-theme="dark"]{--bg:#231820;--card:#322230;--ink:#fbeef2;--mut:#c9adb8;--acc:#ff8fb0;--acc2:#4a2a3b;--line:#4a3443}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 17px/1.45 'Nunito',system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:36px 18px 48px}
h1{font:800 34px/1.1 'Fraunces',Georgia,serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 26px}
a.op{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 18px;margin:14px 0;text-decoration:none;color:var(--ink)}
a.op:hover,a.op:focus-visible{border-color:var(--acc);outline:none}
.ic{flex:none;width:64px;height:64px;border-radius:18px;background:var(--acc2);display:grid;place-items:center;font-size:32px}
a.op b{display:block;font:800 22px 'Fraunces',Georgia,serif}a.op span{color:var(--mut);font-size:15px}
.go{margin-left:auto;color:var(--acc);font-size:24px;font-weight:800}
.note{text-align:center;color:var(--mut);font-size:14px;margin-top:28px}
</style></head><body><main>
<h1>Hola, Alexandra 💗</h1>
<p class="sub">Todo tu plan en un solo lugar. ¿Qué vas a ver hoy?</p>
<a class="op" href="dieta/"><div class="ic">🍽️</div><div><b>Mi dieta</b><span>40 recetas ricas, paso a paso</span></div><div class="go">›</div></a>
<a class="op" href="rutina/"><div class="ic">💪</div><div><b>Mi rutina</b><span>Tus sesiones y tu semana</span></div><div class="go">›</div></a>
<p class="note">Consejo: guarda esta página en la pantalla de inicio de tu celular.</p>
</main></body></html>
